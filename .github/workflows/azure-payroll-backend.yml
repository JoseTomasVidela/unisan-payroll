name: Deploy Payroll Backend to Azure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build backend package
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend
          zip -r ../payroll-backend.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_PAYROLL_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PAYROLL_PUBLISH_PROFILE }}
          package: payroll-backend.zip
