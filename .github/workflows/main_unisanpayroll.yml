name: Build and deploy Python app to Azure Web App - unisanpayroll

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/working_ui/**"
      - "frontend/build/**"
      - ".github/workflows/main_unisanpayroll.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare backend package
        run: |
          mkdir -p deploy/backend
          mkdir -p deploy/frontend/build
          cp -R backend/. deploy/backend/
          cp backend/requirements.txt deploy/requirements.txt
          cp -R frontend/working_ui/. deploy/frontend/build/

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ secrets.AZURE_PAYROLL_WEBAPP_NAME }}
          slot-name: "Production"
          publish-profile: ${{ secrets.AZURE_PAYROLL_PUBLISH_PROFILE }}
